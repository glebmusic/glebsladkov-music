<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Какой музыкальный жанр тебе подходит?</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #111, #222, #333);
    color: #fff;
    text-align: center;
    padding: 20px;
    transition: background 1s ease;
  }
  h1 {
    margin-top: 20px;
    font-size: 2em;
    color: #ffcc00;
  }
  .question {
    margin: 40px auto;
    width: 90%;
    max-width: 600px;
    background: #1c1c1c;
    border-radius: 10px;
    padding: 25px;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
  }
  button {
    margin: 10px;
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #444;
    color: white;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover {
    background: #666;
    transform: scale(1.05);
  }
  #result {
    font-size: 1.7em;
    margin-top: 40px;
    color: #ffcc00;
  }
  #description {
    max-width: 600px;
    margin: 20px auto;
    font-size: 1.1em;
  }
  #restart {
    display: none;
    margin-top: 25px;
    padding: 10px 25px;
    font-size: 16px;
    background: #ffcc00;
    color: #111;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #restart:hover { background: #ffdb4d; }
  #genre-image {
    display: none;
    margin-top: 25px;
    max-width: 300px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(255,255,255,0.3);
  }
  audio { margin-top: 25px; }
</style>
</head>
<body>

<h1>🎵 Какой музыкальный жанр тебе подходит?</h1>
<div id="quiz"></div>
<h2 id="result"></h2>
<p id="description"></p>
<img id="genre-image" src="" alt="Жанр">
<button id="restart" onclick="restartQuiz()">Пройти снова</button>
<audio id="music" controls hidden></audio>

<script>
const questions = [
  { q: "Какое у тебя настроение чаще всего?",
    a: { "💥 Взрывное, энергичное": "rock", "🌈 Весёлое и лёгкое": "pop", "🤔 Задумчивое, глубокое": "rap", "🌙 Спокойное, мечтательное": "jazz" } },
  { q: "Где тебе комфортнее всего?",
    a: { "🎤 На концерте, где все кричат и поют": "rock", "💃 На вечеринке с друзьями": "pop", "🌆 В наушниках на прогулке ночью": "rap", "☕ В уютном кафе с чашкой кофе": "jazz" } },
  { q: "Что для тебя важнее в музыке?",
    a: { "🔥 Мощная энергия": "rock", "🎶 Ритм и мелодия": "pop", "📝 Смысл текста": "rap", "🎷 Атмосфера и настроение": "jazz" } },
  { q: "Какой у тебя стиль одежды?",
    a: { "👢 Джинсы, косуха, кеды": "rock", "👗 Яркий и стильный": "pop", "🧢 Удобный и уличный": "rap", "🕶 Классика и минимализм": "jazz" } },
  { q: "Как ты реагируешь на трудности?",
    a: { "💪 Иду напролом": "rock", "🙂 Улыбаюсь и иду дальше": "pop", "💭 Думаю и ищу смысл": "rap", "🌬 Просто отпускаю ситуацию": "jazz" } },
  { q: "Как ты проводишь выходные?",
    a: { "🤘 На концертах или в движухе": "rock", "🎉 С друзьями и весельем": "pop", "📒 Слушаю музыку и пишу заметки": "rap", "☕ Дома с фильмом и пледом": "jazz" } },
  { q: "Кто ты в компании друзей?",
    a: { "🔥 Лидер, который всё решает": "rock", "😄 Душа компании": "pop", "🎯 Наблюдаю, но говорю метко": "rap", "😌 Тихий, но харизматичный": "jazz" } },
  { q: "Какой инструмент тебе ближе?",
    a: { "🎸 Электрогитара": "rock", "🎹 Синтезатор": "pop", "🎤 Бит и микрофон": "rap", "🎷 Саксофон": "jazz" } },
  { q: "Какой у тебя любимый фильм?",
    a: { "🚗 С экшеном и драйвом": "rock", "💕 Романтическая комедия": "pop", "🎭 Драма с глубоким смыслом": "rap", "🎬 Старое доброе кино": "jazz" } },
  { q: "Какую цитату ты бы выбрал?",
    a: { "🔊 «Живи громко!»": "rock", "😊 «Главное — улыбаться»": "pop", "🎤 «Мой голос — моё оружие»": "rap", "🌌 «Спокойствие — ключ к гармонии»": "jazz" } }
];

let scores = { rock: 0, pop: 0, rap: 0, jazz: 0 };
let current = 0;

const descriptions = {
  rock: "🎸 <b>Рок</b> — твой жанр! Ты человек драйва и свободы.",
  pop: "🎤 <b>Поп</b> — твой жанр! Ты позитивный и лёгкий на подъём.",
  rap: "🎧 <b>Рэп / Хип-хоп</b> — твой жанр! Ты вдумчивый и честный.",
  jazz: "🎷 <b>Джаз</b> — твой жанр! Ты спокоен и мечтателен."
};

const musicLinks = {
  rock: "https://cdn.pixabay.com/download/audio/2022/03/22/audio_c77f1b2475.mp3?filename=energetic-rock-trailer-14118.mp3",
  pop:  "https://cdn.pixabay.com/download/audio/2023/03/10/audio_5d09a23e1b.mp3?filename=summer-pop-14152.mp3",
  rap:  "https://cdn.pixabay.com/download/audio/2022/03/11/audio_0da8d32143.mp3?filename=hip-hop-background-12579.mp3",
  jazz: "https://cdn.pixabay.com/download/audio/2022/03/11/audio_d32e0fddda.mp3?filename=jazzy-abstract-beat-11040.mp3"
};

const images = {
  rock: "https://cdn.pixabay.com/photo/2015/07/17/22/43/concert-849361_1280.jpg",
  pop:  "https://cdn.pixabay.com/photo/2016/11/21/12/59/music-1841180_1280.jpg",
  rap:  "https://cdn.pixabay.com/photo/2016/11/29/13/12/man-1867009_1280.jpg",
  jazz: "https://cdn.pixabay.com/photo/2015/11/07/11/03/saxophone-1033644_1280.jpg"
};

const backgrounds = {
  rock: "linear-gradient(135deg, #ff0000, #660000)",
  pop: "linear-gradient(135deg, #ff66b2, #ffccff)",
  rap: "linear-gradient(135deg, #111, #333)",
  jazz: "linear-gradient(135deg, #5e4b8b, #b49fd6)"
};

function showQuestion() {
  if (current >= questions.length) return showResult();
  const q = questions[current];
  let html = `<div class='question'><h2>${q.q}</h2>`;
  for (let key in q.a) {
    html += `<button onclick="answer('${q.a[key]}')">${key}</button>`;
  }
  html += "</div>";
  document.getElementById("quiz").innerHTML = html;
}

function answer(genre) {
  scores[genre]++;
  current++;
  showQuestion();
}

function showResult() {
  const best = Object.keys(scores).reduce((a,b)=>scores[a]>scores[b]?a:b);
  document.getElementById("quiz").innerHTML = "";
  document.getElementById("result").innerText = "Тебе подходит жанр: " + best.toUpperCase();
  document.getElementById("description").innerHTML = descriptions[best];
  document.getElementById("restart").style.display = "inline-block";
  const audio = document.getElementById("music");
  audio.src = musicLinks[best];
  audio.hidden = false;
  audio.play();
  document.body.style.background = backgrounds[best];
  const img = document.getElementById("genre-image");
  img.src = images[best];
  img.style.display = "block";
}

function restartQuiz() {
  scores = { rock: 0, pop: 0, rap: 0, jazz: 0 };
  current = 0;
  document.getElementById("result").innerText = "";
  document.getElementById("description").innerHTML = "";
  document.getElementById("restart").style.display = "none";
  document.getElementById("genre-image").style.display = "none";
  const audio = document.getElementById("music");
  audio.pause();
  audio.hidden = true;
  document.body.style.background = "linear-gradient(135deg, #111, #222, #333)";
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
